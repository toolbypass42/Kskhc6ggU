<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingshop102 - Nhận Bypass Link</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    padding: 20px;
    overflow: hidden;
  }

  .container {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 40px 30px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    width: 90px;
    height: 90px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #25F4EE, #FE2C55);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    box-shadow: 0 0 30px rgba(254, 44, 85, 0.6);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(254, 44, 85, 0.6); }
    50% { box-shadow: 0 0 50px rgba(37, 244, 238, 0.8); }
  }

  h1 {
    color: #fff;
    font-size: 22px;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .subtitle {
    color: #b8b8d1;
    font-size: 14px;
    margin-bottom: 30px;
    line-height: 1.5;
  }

  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    color: #fff;
  }

  .btn-tiktok {
    background: linear-gradient(135deg, #25F4EE, #FE2C55);
    margin-bottom: 18px;
    box-shadow: 0 8px 25px rgba(254, 44, 85, 0.4);
  }

  .btn-tiktok:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(254, 44, 85, 0.6);
  }

  .btn-tiktok:active {
    transform: scale(0.97);
  }

  .btn-tiktok.followed {
    background: linear-gradient(135deg, #4a4a5e, #2a2a3a);
    box-shadow: none;
    opacity: 0.85;
    cursor: default;
  }

  .btn-bypass {
    background: linear-gradient(135deg, #00c853, #00e676);
    box-shadow: 0 8px 25px rgba(0, 200, 83, 0.4);
    position: relative;
  }

  .btn-bypass.active:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(0, 200, 83, 0.6);
  }

  .btn-bypass:disabled {
    background: linear-gradient(135deg, #3a3a4a, #2a2a3a);
    box-shadow: none;
    cursor: not-allowed;
    opacity: 0.6;
  }

  .lock-icon {
    font-size: 18px;
  }

  .status {
    margin-top: 18px;
    font-size: 13px;
    color: #ffb74d;
    min-height: 20px;
    transition: all 0.3s ease;
  }

  .status.unlocked {
    color: #00e676;
    font-weight: 600;
  }

  .footer {
    margin-top: 25px;
    font-size: 12px;
    color: #6c6c8a;
  }

  /* Nút reset nhỏ ở góc */
  .reset-btn {
    position: fixed;
    bottom: 15px;
    right: 15px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #888;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .reset-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">🎵</div>
  <h1>KINGSHOP102</h1>
  <p class="subtitle">
    Nhấn <b>Follow TikTok</b> để mở khóa<br>nút lấy Bypass Link 🔓
  </p>

  <!-- Nút Follow TikTok -->
  <a 
    href="https://tiktok.com/@kingshop102" 
    target="_blank" 
    rel="noopener noreferrer"
    class="btn btn-tiktok" 
    id="followBtn">
    <span>🎵</span> Follow TikTok Ngay
  </a>

  <!-- Nút Bypass bị khóa -->
  <button 
    class="btn btn-bypass" 
    id="bypassBtn" 
    disabled>
    <span class="lock-icon">🔒</span>
    <span id="bypassText">Lấy Bypass Link</span>
  </button>

  <div class="status" id="status">
    ⚠️ Vui lòng follow TikTok để mở khóa
  </div>

  <div class="footer">© Kingshop102 - All Rights Reserved</div>
</div>

<!-- Nút reset trạng thái (ẩn góc dưới) -->
<button class="reset-btn" id="resetBtn">🔄 Reset trạng thái</button>

<script>
  const followBtn = document.getElementById('followBtn');
  const bypassBtn = document.getElementById('bypassBtn');
  const status = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');

  const STORAGE_KEY = 'kingshop102_followed';

  let isUnlocked = false;

  // === Hàm mở khóa nút bypass ===
  function unlockBypass(silent = false) {
    isUnlocked = true;

    // Mở khóa nút bypass
    bypassBtn.disabled = false;
    bypassBtn.classList.add('active');
    bypassBtn.innerHTML = '<span>🔓</span> Lấy Bypass Link';

    // Đổi nút TikTok thành "đã follow"
    followBtn.classList.add('followed');
    followBtn.innerHTML = '<span>✅</span> Đã Follow';
    followBtn.removeAttribute('href');

    // Cập nhật trạng thái
    status.textContent = '✅ Đã mở khóa! Nhấn nút xanh để lấy link';
    status.classList.add('unlocked');

    if (!silent) {
      // Lưu trạng thái vào localStorage
      localStorage.setItem(STORAGE_KEY, 'true');
    }
  }

  // === Hàm khóa lại (reset) ===
  function lockBypass() {
    isUnlocked = false;
    bypassBtn.disabled = true;
    bypassBtn.classList.remove('active');
    bypassBtn.innerHTML = '<span class="lock-icon">🔒</span> <span id="bypassText">Lấy Bypass Link</span>';

    followBtn.classList.remove('followed');
    followBtn.innerHTML = '<span>🎵</span> Follow TikTok Ngay';
    followBtn.setAttribute('href', 'https://tiktok.com/@kingshop102');

    status.textContent = '⚠️ Vui lòng follow TikTok để mở khóa';
    status.classList.remove('unlocked');
  }

  // === Kiểm tra trạng thái đã lưu khi load trang ===
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved === 'true') {
      unlockBypass(true); // Mở khóa ngay, không cần lưu lại
      status.textContent = '✅ Trạng thái đã được lưu từ lần trước';
    }
  });

  // === Khi nhấn Follow TikTok ===
  followBtn.addEventListener('click', (e) => {
    if (isUnlocked) {
      e.preventDefault();
      return;
    }

    // Hiển thị trạng thái đang xác nhận
    status.textContent = '⏳ Đang xác nhận follow...';
    status.style.color = '#2196f3';

    // Sau 1.2s tự động mở khóa
    setTimeout(() => {
      status.style.color = '';
      unlockBypass(false);
    }, 1200);
  });

  // === Khi nhấn nút Bypass ===
  bypassBtn.addEventListener('click', () => {
    if (!isUnlocked) return;
    window.open('https://toolbypass42.github.io/Kskhc6ggU/', '_blank');
  });

  // === Nút Reset ===
  resetBtn.addEventListener('click', () => {
    if (confirm('Bạn có chắc muốn reset trạng thái? Bạn sẽ phải follow lại TikTok.')) {
      localStorage.removeItem(STORAGE_KEY);
      lockBypass();
    }
  });
</script>

</body>
</html>
