<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKER ACCESS</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    min-height: 100vh;
    background: #0a0005;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(255, 20, 147, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(255, 105, 180, 0.1) 0%, transparent 50%),
      linear-gradient(135deg, #0a0005 0%, #1a0010 50%, #0a0005 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  /* Hiệu ứng nền lưới */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255, 20, 147, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 20, 147, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
  }

  @keyframes gridMove {
    0% { transform: translate(0, 0); }
    100% { transform: translate(40px, 40px); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    background: rgba(10, 0, 5, 0.85);
    border: 2px solid #ff1493;
    border-radius: 16px;
    padding: 40px 30px;
    box-shadow: 
      0 0 30px rgba(255, 20, 147, 0.6),
      0 0 60px rgba(255, 20, 147, 0.3),
      inset 0 0 30px rgba(255, 20, 147, 0.1);
    backdrop-filter: blur(10px);
    animation: pulseGlow 3s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { 
      box-shadow: 
        0 0 30px rgba(255, 20, 147, 0.6),
        0 0 60px rgba(255, 20, 147, 0.3),
        inset 0 0 30px rgba(255, 20, 147, 0.1);
    }
    50% { 
      box-shadow: 
        0 0 40px rgba(255, 20, 147, 0.9),
        0 0 80px rgba(255, 20, 147, 0.5),
        inset 0 0 40px rgba(255, 20, 147, 0.2);
    }
  }

  .title {
    text-align: center;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #ff1493;
    text-shadow: 
      0 0 10px #ff1493,
      0 0 20px #ff1493,
      0 0 40px #ff1493;
    margin-bottom: 8px;
    animation: flicker 3s infinite;
  }

  @keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.4; }
  }

  .subtitle {
    text-align: center;
    font-size: 12px;
    color: #ff69b4;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 35px;
    opacity: 0.8;
  }

  .divider {
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff1493, transparent);
    margin-bottom: 30px;
    box-shadow: 0 0 10px #ff1493;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 18px 24px;
    margin-bottom: 18px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 10px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .btn-main {
    background: linear-gradient(135deg, #ff1493, #ff69b4);
    color: #0a0005;
    border: 2px solid #ff1493;
    box-shadow: 
      0 0 20px rgba(255, 20, 147, 0.7),
      inset 0 0 20px rgba(255, 255, 255, 0.2);
  }

  .btn-main:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 
      0 0 30px rgba(255, 20, 147, 1),
      0 0 50px rgba(255, 20, 147, 0.7),
      inset 0 0 30px rgba(255, 255, 255, 0.4);
    letter-spacing: 4px;
  }

  .btn-backup {
    background: transparent;
    color: #ff1493;
    border: 2px solid #ff1493;
    box-shadow: 
      0 0 15px rgba(255, 20, 147, 0.4),
      inset 0 0 15px rgba(255, 20, 147, 0.1);
  }

  .btn-backup:hover {
    background: rgba(255, 20, 147, 0.15);
    transform: translateY(-3px) scale(1.02);
    box-shadow: 
      0 0 25px rgba(255, 20, 147, 0.8),
      inset 0 0 25px rgba(255, 20, 147, 0.3);
    letter-spacing: 4px;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
  }

  .btn:hover::before {
    left: 100%;
  }

  .icon {
    font-size: 20px;
  }

  .backup-label {
    text-align: center;
    font-size: 11px;
    color: #ff69b4;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 25px 0 15px;
    opacity: 0.7;
    position: relative;
  }

  .backup-label::before,
  .backup-label::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 25%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #ff1493);
  }

  .backup-label::before { left: 0; }
  .backup-label::after { 
    right: 0; 
    background: linear-gradient(90deg, #ff1493, transparent);
  }

  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 25px;
    font-size: 11px;
    color: #ff69b4;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #ff1493;
    border-radius: 50%;
    box-shadow: 0 0 10px #ff1493;
    animation: blink 1.5s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @media (max-width: 480px) {
    .container { padding: 30px 20px; }
    .title { font-size: 24px; letter-spacing: 3px; }
    .btn { font-size: 14px; padding: 16px 20px; letter-spacing: 1px; }
  }
</style>
</head>
<body>

  <div class="container">
    <h1 class="title">HACKER</h1>
    <p class="subtitle">▸ Access Portal ◂</p>
    <div class="divider"></div>

    <!-- LINK CHÍNH -->
    <a href="https://phienchoso.com/1c7261eaa492ab943c60.tk" 
       class="btn btn-main" 
       target="_blank" 
       rel="noopener noreferrer">
      <span class="icon">⚡</span>
      <span>LINK CHÍNH</span>
    </a>

    <!-- LINK DỰ PHÒNG -->
    <p class="backup-label">Link dự phòng khi lỗi</p>

    <a href="https://sitetop.one/4FCWQs" 
       class="btn btn-backup" 
       target="_blank" 
       rel="noopener noreferrer">
      <span class="icon">🛡️</span>
      <span>LINK DỰ PHÒNG</span>
    </a>

    <div class="status">
      <span class="status-dot"></span>
      <span>System Online</span>
    </div>
  </div>

</body>
</html>
