<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KingShop102 - Bypass Tool</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a0011 0%, #000 70%);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
  }

  .container {
    background: linear-gradient(145deg, #0d0d0d, #1a0016);
    border: 2px solid #ff1493;
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 25px #ff1493, 0 0 60px rgba(255, 20, 147, 0.4), inset 0 0 15px rgba(255, 20, 147, 0.2);
    position: relative;
    animation: glow 2.5s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { box-shadow: 0 0 20px #ff1493, 0 0 40px rgba(255, 20, 147, 0.3); }
    to { box-shadow: 0 0 35px #ff1493, 0 0 80px rgba(255, 20, 147, 0.6); }
  }

  h1 {
    font-size: 26px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ff1493, #ff69b4, #ff1493);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
    font-weight: 800;
    letter-spacing: 1px;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .subtitle {
    color: #ff8cc8;
    font-size: 13px;
    margin-bottom: 30px;
    opacity: 0.85;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    margin-bottom: 15px;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }

  .btn-tiktok {
    background: linear-gradient(135deg, #000 0%, #ff1493 100%);
    color: #fff;
    border: 2px solid #ff1493;
  }

  .btn-tiktok:hover {
    background: linear-gradient(135deg, #ff1493 0%, #000 100%);
    box-shadow: 0 0 20px #ff1493, 0 0 40px rgba(255,20,147,0.5);
    transform: translateY(-2px);
  }

  .btn-tiktok svg {
    width: 22px;
    height: 22px;
    fill: #fff;
    filter: drop-shadow(0 0 4px #fff);
  }

  .btn-bypass {
    background: linear-gradient(135deg, #ff1493 0%, #000 100%);
    color: #fff;
    border: 2px solid #ff1493;
  }

  .btn-bypass:hover {
    box-shadow: 0 0 20px #ff1493, 0 0 40px rgba(255,20,147,0.5);
    transform: translateY(-2px);
  }

  .btn-bypass.locked {
    background: #1a1a1a;
    color: #666;
    border: 2px dashed #555;
    cursor: not-allowed;
    pointer-events: none;
  }

  .btn-bypass.locked::after {
    content: '🔒';
    position: absolute;
    right: 20px;
    font-size: 18px;
  }

  .btn-bypass.unlocked::after {
    content: '🔓';
    position: absolute;
    right: 20px;
    font-size: 18px;
  }

  .status {
    font-size: 12px;
    margin-top: 15px;
    color: #ff8cc8;
    min-height: 18px;
    transition: all 0.3s;
  }

  .status.success {
    color: #00ff9d;
    font-weight: 700;
    text-shadow: 0 0 8px #00ff9d;
  }

  .footer {
    margin-top: 25px;
    font-size: 11px;
    color: #555;
  }

  .footer span {
    color: #ff1493;
  }

  /* Nút reset nhỏ */
  .reset-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: transparent;
    border: 1px solid #333;
    color: #555;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .reset-btn:hover {
    color: #ff1493;
    border-color: #ff1493;
  }
</style>
</head>
<body>

<div class="container">
  <button class="reset-btn" id="resetBtn" title="Xóa trạng thái đã lưu">Reset</button>

  <h1>KING SHOP 102</h1>
  <p class="subtitle">Follow TikTok để mở khóa công cụ Bypass</p>

  <a href="https://tiktok.com/@kingshop102" target="_blank" class="btn btn-tiktok" id="btnFollow">
    <svg viewBox="0 0 24 24">
      <path d="M16.5 3a5.5 5.5 0 0 0 4.5 4.4V10a9 9 0 0 1-4.6-1.3v6.6a6.8 6.8 0 1 1-6.8-6.8c.3 0 .6 0 .9.1v3a3.8 3.8 0 1 0 2.6 3.6V3h3.4z"/>
    </svg>
    Follow TikTok @kingshop102
  </a>

  <a href="https://toolbypass42.github.io/Linktoolpypass/" target="_blank" class="btn btn-bypass locked" id="btnBypass">
    Lấy Bypass Link
  </a>

  <p class="status" id="status">⚠️ Nhấn Follow TikTok để mở khóa</p>

  <div class="footer">Made with <span>♥</span> by KingShop102</div>
</div>

<script>
  const btnFollow = document.getElementById('btnFollow');
  const btnBypass = document.getElementById('btnBypass');
  const status = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');

  const STORAGE_KEY = 'kingshop102_unlocked';

  // Hàm mở khóa UI
  function unlockUI(silent = false) {
    btnBypass.classList.remove('locked');
    btnBypass.classList.add('unlocked');
    if (silent) {
      status.textContent = '✅ Đã mở khóa (trạng thái đã lưu)';
    } else {
      status.textContent = '✅ Đã mở khóa! Nhấn "Lấy Bypass Link" để tiếp tục';
    }
    status.classList.add('success');
  }

  // Hàm khóa UI
  function lockUI() {
    btnBypass.classList.add('locked');
    btnBypass.classList.remove('unlocked');
    status.textContent = '⚠️ Nhấn Follow TikTok để mở khóa';
    status.classList.remove('success');
  }

  // Kiểm tra trạng thái đã lưu khi tải trang
  window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem(STORAGE_KEY) === 'true') {
      unlockUI(true);
    }
  });

  // Khi nhấn Follow → lưu trạng thái + mở khóa
  btnFollow.addEventListener('click', () => {
    localStorage.setItem(STORAGE_KEY, 'true');

    setTimeout(() => {
      unlockUI(false);
    }, 500);

    btnFollow.style.transform = 'scale(0.96)';
    setTimeout(() => btnFollow.style.transform = '', 150);
  });

  // Nút Reset xóa trạng thái
  resetBtn.addEventListener('click', () => {
    if (confirm('Bạn có chắc muốn xóa trạng thái đã lưu không?')) {
      localStorage.removeItem(STORAGE_KEY);
      lockUI();
    }
  });
</script>

</body>
</html>
